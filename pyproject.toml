[project]
name = "web3js-mcp-server"
version = "1.0.0"
description = "A Model Context Protocol (MCP) server exposing Solana Web3 tools — balances, transactions, tokens, DEX quotes, staking, and more."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "solana>=0.36.0",
    "solders>=0.27.0",
    "base58>=2.1.1",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
web3-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

